GENERAL:
  seed: 2021
  log_path: ./logs
  
TRAINING:
  num_k: 2
  learning_rate: 1.0e-4
  num_epochs: 10
  monitor: PearsonCorrCoef
  mode: max
  early_stopping:
    patience: 20
  lr_scheduler:
    patience: 10
    factor: 0.1

DATA:
  data_dir: /storage/hest_data/hs_brain/processed_data_triplex
  output_dir: /storage/hest_data/hs_brain/processed_data_triplex/pred
  gene_type: 'hmhvg'
  num_genes: 200
  num_outputs: 250
  cpm: True
  smooth: True
  model_name: 'uni_v1'
  
  train_dataloader:
        batch_size: 128
        num_workers: 1
        pin_memory: False
        shuffle: True

  test_dataloader:
      batch_size: 1
      num_workers: 0
      pin_memory: False
      shuffle: False